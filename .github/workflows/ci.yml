name: Continuous Integration
on:
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v5

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm' # Caches node_modules for high-speed runs

      - name: Install Project Dependencies
        run: npm ci # Clean, deterministic install from package-lock.json

      - name: Run Static Analysis & Tests
        run: |
              npm run lint
              npm run check
              npm run test:unit